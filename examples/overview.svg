<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc"><title id="title">TenantBreak: verify access, expose leaks, replay the fix</title><desc id="desc">The same four identities and four resources produce nine confirmed leaks against the vulnerable lab and zero against the fixed lab.</desc><rect width="1280" height="660" rx="18" fill="#0b1220"/><g font-family="system-ui,Segoe UI,sans-serif"><text x="40" y="46" fill="#72e6ba" font-family="monospace" font-size="13" letter-spacing="3">TENANTBREAK / AUTHORIZATION EVIDENCE</text><text x="40" y="103" fill="#e8eef7" font-size="36" font-weight="700">Same policy. Two implementations. Observable proof.</text><text x="40" y="138" fill="#a8b8ce" font-size="17">Actual HTTP requests / invented fixture records / verified identities and owner controls</text><rect x="40" y="177" width="580" height="413" rx="12" fill="#111c2e" stroke="#26354b"/><text x="64" y="215" fill="#ff939e" font-size="13" font-weight="700" letter-spacing="1.5">VULNERABLE API</text><text x="64" y="272" fill="#ff939e" font-size="42" font-weight="700">9</text><text x="128" y="268" fill="#e8eef7" font-size="19">confirmed forbidden reads</text><text x="64" y="304" fill="#a8b8ce" font-size="14">4 identities verified / 4 owner controls passed / 16 checks</text><text x="278" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">alice</text><text x="366" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">bob</text><text x="454" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">charlie</text><text x="542" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">admin</text><text x="64" y="390" fill="#e8eef7" font-size="14">alice-invoice</text><rect x="242" y="368" width="72" height="31" rx="5" fill="#15322e"/><text x="278" y="389" text-anchor="middle" fill="#72e6ba" font-family="monospace" font-size="13" font-weight="700">ALLOW</text><rect x="330" y="368" width="72" height="31" rx="5" fill="#392331"/><text x="366" y="389" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="418" y="368" width="72" height="31" rx="5" fill="#392331"/><text x="454" y="389" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="506" y="368" width="72" height="31" rx="5" fill="#15322e"/><text x="542" y="389" text-anchor="middle" fill="#72e6ba" font-family="monospace" font-size="13" font-weight="700">ALLOW</text><text x="64" y="438" fill="#e8eef7" font-size="14">bob-invoice</text><rect x="242" y="416" width="72" height="31" rx="5" fill="#392331"/><text x="278" y="437" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="330" y="416" width="72" height="31" rx="5" fill="#15322e"/><text x="366" y="437" text-anchor="middle" fill="#72e6ba" font-family="monospace" font-size="13" font-weight="700">ALLOW</text><rect x="418" y="416" width="72" height="31" rx="5" fill="#392331"/><text x="454" y="437" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="506" y="416" width="72" height="31" rx="5" fill="#15322e"/><text x="542" y="437" text-anchor="middle" fill="#72e6ba" font-family="monospace" font-size="13" font-weight="700">ALLOW</text><text x="64" y="486" fill="#e8eef7" font-size="14">charlie-invoice</text><rect x="242" y="464" width="72" height="31" rx="5" fill="#392331"/><text x="278" y="485" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="330" y="464" width="72" height="31" rx="5" fill="#392331"/><text x="366" y="485" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="418" y="464" width="72" height="31" rx="5" fill="#15322e"/><text x="454" y="485" text-anchor="middle" fill="#72e6ba" font-family="monospace" font-size="13" font-weight="700">ALLOW</text><rect x="506" y="464" width="72" height="31" rx="5" fill="#392331"/><text x="542" y="485" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><text x="64" y="534" fill="#e8eef7" font-size="14">acme-export</text><rect x="242" y="512" width="72" height="31" rx="5" fill="#392331"/><text x="278" y="533" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="330" y="512" width="72" height="31" rx="5" fill="#392331"/><text x="366" y="533" text-anchor="middle" fill="#ff939e" font-family="monospace" font-size="13" font-weight="700">LEAK</text><rect x="418" y="512" width="72" height="31" rx="5" fill="#15322e"/><text x="454" y="533" text-anchor="middle" fill="#72e6ba" font-family="monospace" font-size="13" font-weight="700">DENY</text><rect x="506" y="512" width="72" height="31" rx="5" fill="#15322e"/><text x="542" y="533" text-anchor="middle" fill="#72e6ba" font-family="monospace" font-size="13" font-weight="700">ALLOW</text><rect x="660" y="177" width="580" height="413" rx="12" fill="#111c2e" stroke="#26354b"/><text x="684" y="215" fill="#72e6ba" font-size="13" font-weight="700" letter-spacing="1.5">FIXED API</text><text x="684" y="272" fill="#72e6ba" font-size="42" font-weight="700">0</text><text x="748" y="268" fill="#e8eef7" font-size="19">confirmed forbidden reads</text><text x="684" y="304" fill="#a8b8ce" font-size="14">4 identities verified / 4 owner controls passed / 16 checks</text><text x="898" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">alice</text><text x="986" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">bob</text><text x="1074" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">charlie</text><text x="1162" y="349" text-anchor="middle" fill="#a8b8ce" font-size="13">admin</text><text x="684" y="390" fill="#e8eef7" font-size="14">alice-invoice</text><rect x="862" y="368" widt