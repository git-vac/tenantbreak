[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenantbreak"
version = "0.4.0"
description = "Evidence-based API authorization regression tests across users, roles, and tenants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "git-vac"}]
keywords = ["security", "authorization", "api", "bola", "multi-tenant"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
openapi = ["PyYAML>=6.0.2,<7"]

[project.scripts]
tenantbreak = "tenantbreak.cli:main"

[project.urls]
Repository = "https://github.com/git-vac/tenantbreak"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tenantbreak = ["demo-policy.json"]
